<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Company 0 — MIDAS decision console</title>
<style>
:root{
  --bg:#0e100d; --panel:#15181312; --line:#2b3026; --line2:#3a4133;
  --ink:#e9e7e0; --dim:#a0a496; --faint:#767b6c;
  --good:#8fb573; --warn:#d4a017; --bad:#e07a5f; --cool:#7fa6c9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Georgia,"Iowan Old Style",serif}
a{color:var(--good)}
header.top{display:flex;gap:24px;align-items:baseline;padding:16px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20;flex-wrap:wrap}
header.top h1{margin:0;font-size:18px;letter-spacing:.06em}
header.top .obj{color:var(--dim);font-size:14px}
header.top .obj b{color:var(--ink)}
.wrap{display:grid;grid-template-columns:340px 1fr;gap:0;align-items:start}
aside{border-right:1px solid var(--line);padding:18px 20px;position:sticky;top:57px;max-height:calc(100vh - 57px);overflow:auto}
main{padding:18px 24px 80px;min-width:0}
h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:22px 0 10px;font-family:system-ui,sans-serif;font-weight:600}
h2:first-child{margin-top:0}
.row{padding:7px 0;border-bottom:1px solid #1e221b}
.row .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-family:system-ui,sans-serif}
.row .val{font-size:14px}
.row .note{font-size:12px;color:var(--faint);font-style:italic;margin-top:3px}
.chip{display:inline-block;font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--line2);border-radius:2px;padding:1px 6px;color:var(--dim);vertical-align:1px}
.chip.verified{color:var(--good);border-color:#3f5b32}
.chip.unknown{color:var(--warn);border-color:#5c4a14}
.chip.unverified{color:var(--cool);border-color:#33506b}
.chip.owner{color:var(--dim)}
.card{border:1px solid var(--line);padding:14px 16px;margin:0 0 12px;cursor:pointer;background:#12150f}
.card:hover{border-color:var(--line2)}
.card h3{margin:0 0 4px;font-size:16px}
.card .meta{font-size:12px;color:var(--faint);font-family:system-ui,sans-serif}
.card .fitline{margin-top:8px;font-size:13px;color:var(--dim)}
.fit{font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.08em;padding:2px 7px;border:1px solid;border-radius:2px;text-transform:uppercase}
.fit.open{color:var(--good);border-color:#3f5b32}
.fit.after{color:var(--warn);border-color:#5c4a14}
.fit.closed{color:var(--faint);border-color:var(--line2)}
.fit.unknown{color:var(--cool);border-color:#33506b}
button{font:inherit;background:#1b1f17;color:var(--ink);border:1px solid var(--line2);padding:9px 14px;cursor:pointer;margin:0 8px 8px 0}
button:hover{border-color:var(--good)}
button.primary{background:#243019;border-color:var(--good);font-weight:bold}
button.ghost{background:none;color:var(--dim);font-size:13px;padding:5px 9px}
button:disabled{opacity:.45;cursor:not-allowed}
.action{border:2px solid var(--good);padding:18px 20px;margin:0 0 16px;background:#161c11}
.action .k{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.action .v{font-size:30px;line-height:1.2;margin:6px 0 0;color:#d8ecc4}
.audit{border:1px solid;padding:12px 16px;margin:0 0 16px}
.audit.pass{border-color:#3f5b32;background:#141a10}
.audit.fail{border-color:var(--bad);background:#231410}
.audit.undet{border-color:#5c4a14;background:#211c10}
.audit .k{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
ul{margin:6px 0;padding-left:20px}
li{margin:3px 0}
.stages{display:flex;gap:0;margin:16px 0;font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;flex-wrap:wrap}
.stages span{padding:6px 12px;border:1px solid var(--line);color:var(--faint);margin:0 -1px 0 0}
.stages span.on{color:var(--bg);background:var(--good);border-color:var(--good);font-weight:bold}
.stages span.done{color:var(--good);border-color:#3f5b32}
.stages span.failed{color:var(--bg);background:var(--bad);border-color:var(--bad)}
details{border:1px solid var(--line);padding:10px 14px;margin:0 0 10px}
details summary{cursor:pointer;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
pre{white-space:pre-wrap;word-break:break-word;font-size:11px;color:var(--faint);background:#0b0d09;border:1px solid var(--line);padding:10px;max-height:340px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid #1e221b;text-align:left;padding:6px 8px;vertical-align:top}
th{font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.muted{color:var(--faint)} .warn{color:var(--warn)} .bad{color:var(--bad)} .good{color:var(--good)}
.unknown-val{color:var(--warn);font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.08em}
.hidden{display:none}
.banner{border:1px solid #5c4a14;background:#1d1a10;padding:10px 14px;margin:0 0 14px;font-size:13px;color:#e0cf9a}
.crumb{font-size:12px;color:var(--faint);margin:0 0 12px;font-family:system-ui,sans-serif}
.crumb a{cursor:pointer;color:var(--dim);text-decoration:underline}
label{display:block;font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:10px 0 4px}
select,input[type=text],input[type=number],textarea{font:inherit;background:#0b0d09;color:var(--ink);border:1px solid var(--line2);padding:7px 9px;width:100%;max-width:520px}
textarea{min-height:70px}
</style>
</head>
<body>

<header class="top">
  <h1>MIDAS · COMPANY 0</h1>
  <div class="obj" id="objective">loading…</div>
</header>

<div class="wrap">
  <aside id="company">loading…</aside>
  <main>
    <div id="listView">
      <h2>Opportunities MIDAS holds</h2>
      <p class="muted" id="listNote"></p>
      <div id="list"></div>
    </div>
    <div id="detailView" class="hidden"></div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const UNKNOWN = '<span class="unknown-val">UNKNOWN</span>';
const val = (v) => (v === null || v === undefined || v === "" || v === "UNKNOWN") ? UNKNOWN : esc(v);
const get = (u) => fetch(u).then((r) => r.json());
const post = (u, b) => fetch(u, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(b || {}) }).then((r) => r.json());

const CHIP = { midas_verified_primary_source: ["verified", "VERIFIED"], owner_reported: ["owner", "OWNER-REPORTED"],
  midas_reported_unverified: ["unverified", "UNVERIFIED"], unknown: ["unknown", "UNKNOWN"] };
const FITCLASS = { SUBMISSION_OPEN_BEFORE_OBJECTIVE_DATE: "open", SUBMISSION_CLOSES_AFTER_OBJECTIVE_DATE: "after",
  CLOSED_BEFORE_TODAY: "closed", UNKNOWN: "unknown" };
const FITLABEL = { SUBMISSION_OPEN_BEFORE_OBJECTIVE_DATE: "open before objective date",
  SUBMISSION_CLOSES_AFTER_OBJECTIVE_DATE: "closes after objective date", CLOSED_BEFORE_TODAY: "closed", UNKNOWN: "no date stated" };

let COMPANY = null;

async function loadCompany() {
  COMPANY = await get("/console/api/company0");
  $("objective").innerHTML = "Objective: <b>" + esc(COMPANY.objective) + "</b> &nbsp;·&nbsp; as of " + esc(COMPANY.asOf);
  const rows = COMPANY.rows.map((r) => {
    const c = CHIP[r.knownAs] || ["unknown", String(r.knownAs).toUpperCase()];
    return '<div class="row"><div class="lab">' + esc(r.label) + ' <span class="chip ' + c[0] + '">' + c[1] + "</span></div>"
      + '<div class="val">' + val(r.value) + "</div>"
      + (r.note ? '<div class="note">' + esc(r.note) + "</div>" : "") + "</div>";
  }).join("");
  $("company").innerHTML = "<h2>Company 0 state</h2>" + rows
    + "<h2>Open unknowns (" + COMPANY.unknowns.length + ")</h2><ul class=\"muted\">"
    + COMPANY.unknowns.map((u) => "<li>" + esc(u) + "</li>").join("") + "</ul>"
    + '<p class="note muted">Nothing here is scored, ranked or estimated. Anything not known says UNKNOWN.</p>';
}

async function loadList() {
  const d = await get("/console/api/opportunities");
  const open = d.opportunities.filter((o) => o.objectiveFit === "SUBMISSION_OPEN_BEFORE_OBJECTIVE_DATE").length;
  $("listNote").textContent = d.opportunities.length + " real records held. " + open
    + " still open before the objective date. Closing dates are parsed from the wording the evidence uses, shown on each record.";
  $("list").innerHTML = d.opportunities.map((o) => {
    const fc = FITCLASS[o.objectiveFit] || "unknown";
    return '<div class="card" onclick="openOpportunity(\'' + o.id + '\')">'
      + "<h3>" + esc(o.title) + "</h3>"
      + '<div class="meta">' + esc(o.buyer) + " · " + esc(o.type)
      + (o.sourceVerified ? ' · <span class="good">source fetched 200</span>' : ' · <span class="muted">source not verified</span>')
      + " · state " + esc(o.state) + (o.runs ? " · " + o.runs + " MIDAS run(s)" : "") + "</div>"
      + '<div class="fitline"><span class="fit ' + fc + '">' + FITLABEL[o.objectiveFit] + "</span> &nbsp; "
      + (o.submission.date ? "closes " + esc(o.submission.date) : "no closing date stated") + "</div>"
      + '<div class="fitline muted">Blocker on record: ' + (o.majorBlocker === "UNKNOWN" ? UNKNOWN : esc(o.majorBlocker)) + "</div>"
      + "</div>";
  }).join("");
}

function backToList() {
  $("detailView").classList.add("hidden");
  $("listView").classList.remove("hidden");
  loadList();
}

let CURRENT = null;

async function openOpportunity(id) {
  CURRENT = await get("/console/api/opportunities/" + encodeURIComponent(id));
  $("listView").classList.add("hidden");
  $("detailView").classList.remove("hidden");
  renderDetail();
}

function renderDetail() {
  const d = CURRENT, p = d.packet, fc = FITCLASS[d.objectiveFit.fit] || "unknown";
  const hist = d.history.map((h) => "<tr><td>" + esc(String(h.startedAt).slice(0, 16).replace("T", " ")) + (h.historical ? ' <span class="chip">preserved</span>' : "")
    + "</td><td>" + esc(h.inputFingerprint) + "</td><td>" + (h.recommendedAction ? esc(h.recommendedAction) : esc(h.stage))
    + "</td><td>" + val(h.auditDisposition) + "</td><td>" + esc(h.ownerDisposition) + "</td><td>" + (h.outcome ? esc(h.outcome) : UNKNOWN)
    + '</td><td><button class="ghost" onclick="openRun(\'' + h.runId + "')\">open</button></td></tr>").join("");

  $("detailView").innerHTML =
    '<div class="crumb"><a onclick="backToList()">← all opportunities</a></div>'
    + "<h2>What it is</h2><h3 style=\"margin:0 0 6px;font-size:20px\">" + esc(p.title) + "</h3>"
    + '<div class="muted" style="font-size:13px">' + esc(p.buyer) + " · " + esc(p.channel) + " · " + esc(p.workItemId) + "</div>"
    + '<p><span class="fit ' + fc + '">' + FITLABEL[d.objectiveFit.fit] + "</span> " + esc(d.objectiveFit.why) + "</p>"
    + (d.objectiveFit.submission.statedAs
      ? '<p class="muted" style="font-size:12px">Parsed from [' + esc(d.objectiveFit.submission.evidenceId) + "] &ldquo;" + esc(d.objectiveFit.submission.statedAs) + "&rdquo;</p>" : "")
    + "<h2>Known economics</h2><p>" + (d.statedBudget.statedAs
      ? esc(d.statedBudget.statedAs) + ' <span class="muted">[' + esc(d.statedBudget.evidenceId) + "]</span>"
      : UNKNOWN + ' <span class="muted">— no budget is stated in the evidence held, and no figure is estimated.'
        + (d.statedBudget.absenceStatedAs ? " The evidence says so in terms: &ldquo;" + esc(d.statedBudget.absenceStatedAs) + "&rdquo;" : "")
        + "</span>") + "</p>"
    + "<h2>Source and evidence</h2>"
    + '<p class="muted" style="font-size:13px">' + esc(p.sourceKind) + "<br/>" + esc(p.livenessCheck)
    + "<br/>" + (p.sourceUrl && p.sourceUrl !== "UNKNOWN" ? '<a href="' + esc(p.sourceUrl) + '" target="_blank" rel="noopener">' + esc(p.sourceUrl) + "</a>" : UNKNOWN) + "</p>"
    + "<table><tr><th>id</th><th>from</th><th>what it says</th></tr>"
    + p.evidence.map((e) => "<tr><td>" + esc(e.id) + "</td><td>" + esc(e.source) + "</td><td>" + esc(e.text) + "</td></tr>").join("") + "</table>"
    + (d.priorQualification
      ? "<h2>Prior MIDAS qualification</h2><p>Decision <b>" + esc(d.priorQualification.decision) + "</b>. "
        + "Missing: " + (d.priorQualification.missing.length ? esc(d.priorQualification.missing.join(", ")) : UNKNOWN) + ".</p>"
        + '<p class="muted" style="font-size:13px">' + esc(d.priorQualification.rationale) + "</p>" : "")
    + (d.contradictions.length ? "<h2>Contradictions in the record</h2><ul class=\"warn\">"
      + d.contradictions.map((c) => "<li>" + esc(c) + "</li>").join("") + "</ul>" : "")
    + "<h2>Unknowns</h2><ul class=\"muted\">" + d.unknowns.map((u) => "<li>" + esc(u) + "</li>").join("") + "</ul>"
    + "<h2>Run MIDAS analysis</h2>"
    + '<p class="muted" style="font-size:13px">Runs the real Researcher → Manager → Auditor chain on this record and Company 0 as it stands. '
    + "Nothing is sent, submitted, applied for or paid. It takes a minute or so.</p>"
    + '<button class="primary" id="runBtn" onclick="startRun()">RUN MIDAS ANALYSIS</button>'
    + '<div id="runArea"></div>'
    + "<h2>Previous MIDAS runs</h2>"
    + (hist ? "<table><tr><th>when</th><th>input</th><th>recommended</th><th>audit</th><th>owner</th><th>outcome</th><th></th></tr>" + hist + "</table>"
      : '<p class="muted">None yet.</p>');
}

const STAGES = ["PREPARING", "RESEARCHING", "DECIDING", "AUDITING", "COMPLETE"];
function stageBar(stage, failed) {
  const i = STAGES.indexOf(stage);
  return '<div class="stages">' + STAGES.map((s, n) => {
    const cls = failed && n === Math.max(i, 0) ? "failed" : n < i ? "done" : n === i ? "on" : "";
    return "<span class=\"" + cls + "\">" + s + "</span>";
  }).join("") + (failed ? '<span class="failed">FAILED</span>' : "") + "</div>";
}

let POLL = null;
async function startRun() {
  $("runBtn").disabled = true;
  const out = await post("/console/api/runs", { opportunityId: CURRENT.packet.workItemId });
  if (out.error) {
    $("runArea").innerHTML = '<div class="banner">' + esc(out.error) + "</div>";
    $("runBtn").disabled = false;
    return;
  }
  pollRun(out.runId);
}

function pollRun(runId) {
  if (POLL) clearInterval(POLL);
  const tick = async () => {
    const r = await get("/console/api/runs/" + encodeURIComponent(runId));
    if (r.stage === "COMPLETE" || r.stage === "FAILED") {
      clearInterval(POLL); POLL = null;
      renderRun(r);
      const btn = $("runBtn"); if (btn) btn.disabled = false;
    } else {
      $("runArea").innerHTML = stageBar(r.stage, false)
        + '<p class="muted">Running the real worker chain. No progress percentage is shown because the chain has three stages of unknown length.</p>';
    }
  };
  tick();
  POLL = setInterval(tick, 2500);
}

async function openRun(runId) {
  const r = await get("/console/api/runs/" + encodeURIComponent(runId));
  renderRun(r);
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

function list(items, cls) {
  if (!items || !items.length) return '<p class="muted">None recorded.</p>';
  return '<ul class="' + (cls || "") + '">' + items.map((i) => "<li>" + esc(typeof i === "string" ? i : JSON.stringify(i)) + "</li>").join("") + "</ul>";
}

function renderRun(r) {
  if (r.stage === "FAILED") {
    $("runArea").innerHTML = stageBar("FAILED", true) + '<div class="banner">The run failed: ' + esc(r.error || "unknown error") + "</div>";
    return;
  }
  const v = r.result, w = r.workers;
  const auditCls = v.audit.cleared ? "pass" : v.audit.objected ? "fail" : "undet";
  const auditHead = v.audit.cleared ? "AUDIT CLEARED THIS DECISION"
    : v.audit.objected ? "AUDIT OBJECTED — NOT CLEARED" : "AUDIT COULD NOT DETERMINE";

  const disagreement = v.audit.objected || v.audit.undetermined
    ? '<div class="audit ' + auditCls + '"><div class="k">' + auditHead + "</div>"
      + "<p><b>The manager recommended:</b> " + esc(v.recommendedAction) + "</p>"
      + "<p><b>The auditor " + (v.audit.objected ? "objected" : "left this unresolved") + ":</b></p>"
      + (v.audit.defects.length ? "<ul>" + v.audit.defects.map((d) => "<li><b>" + esc(d.defectClass) + "</b> — " + esc(d.claim) + "<br/><span class=\"muted\">" + esc(d.why) + "</span></li>").join("") + "</ul>"
        : "<p>" + esc(v.audit.reasoning || "No defect was named.") + "</p>")
      + "<p><b>Final status: " + esc(v.finalStatus) + "</b>. The recommendation is shown above and is not removed; it is not cleared.</p></div>"
    : "";

  $("runArea").innerHTML = stageBar("COMPLETE", false)
    + (r.historical ? '<div class="banner">Preserved result. ' + esc(r.note || "") + "</div>" : "")
    + '<div class="action"><div class="k">Recommended next action</div><div class="v">' + esc(v.recommendedAction) + "</div></div>"
    + disagreement
    + (v.audit.cleared ? '<div class="audit pass"><div class="k">' + auditHead + "</div><p>"
      + esc(v.audit.reasoning || "") + '</p><p class="muted">Records the auditor opened: ' + esc(v.audit.recordsOpened.join(", ") || "none") + "</p></div>" : "")
    + '<div class="grid2">'
    + "<div><h2>Why this action</h2><p>" + val(v.whyThisAction) + "</p>"
    + "<h2>Binding bottleneck</h2><p><b>" + val(v.bindingBottleneck) + "</b></p><p class=\"muted\">" + val(v.bottleneckReasoning) + "</p>"
    + "<h2>Why not the alternatives</h2><p class=\"muted\">" + val(v.whyNotAlternatives) + "</p>"
    + "<h2>Options considered</h2><table><tr><th></th><th>action</th><th>why</th></tr>"
    + v.options.map((o) => "<tr><td>" + (o.chosen ? '<span class="good">chosen</span>' : "") + "</td><td>" + esc(o.action) + "</td><td>" + esc(o.reason || o.rationale) + "</td></tr>").join("")
    + "</table></div>"
    + "<div><h2>Key evidence relied on</h2>" + list(v.keyEvidence)
    + "<h2>Counterevidence and what the source does not say</h2>" + list(v.counterEvidence, "muted")
    + "<h2>Material unknowns</h2>" + list(v.materialUnknowns, "warn")
    + "<h2>Deferred or ignored</h2>" + list(v.deferOrIgnore, "muted") + "</div>"
    + "</div>"
    + "<h2>What it costs and who must act</h2><table>"
    + "<tr><th>Capital at risk</th><td>" + val(v.capitalAtRisk) + "</td></tr>"
    + "<tr><th>Owner time / time to feedback</th><td>" + val(v.ownerTime) + "</td></tr>"
    + "<tr><th>Owner action required</th><td>" + val(v.ownerActionRequired) + "</td></tr>"
    + "<tr><th>Authority required</th><td>" + (v.authorityRequired === true ? '<span class="warn">yes</span>' : v.authorityRequired === false ? "no" : UNKNOWN) + "</td></tr>"
    + "<tr><th>Reversibility</th><td>" + val(v.reversibility) + "</td></tr>"
    + "<tr><th>Falsifier / stop condition</th><td>" + val(v.falsifier) + "</td></tr>"
    + "<tr><th>Reassessment trigger</th><td>" + val(v.reassessmentTrigger) + "</td></tr>"
    + "</table>"
    + (r.analysis ? "<h2>What MIDAS knows about this run</h2><table>"
      + "<tr><th>Material facts the manager dropped</th><td>" + esc((r.analysis.factsLostByManager || []).join(", ") || "none") + "</td></tr>"
      + "<tr><th>Figures with no evidence behind them</th><td>" + esc((r.analysis.inventedFigures || []).join(", ") || "none") + "</td></tr>"
      + "<tr><th>Independent adjudication</th><td>" + val(r.analysis.adjudication) + "</td></tr>"
      + "<tr><th>Primary limitation found</th><td>" + val(r.analysis.adjudicationPrimaryFailure) + "</td></tr>"
      + "</table>" : "")
    + workerBlocks(w)
    + ownerBlock(r)
    + outcomeBlock(r);
}

function workerBlocks(w) {
  if (!w) return "";
  return "<h2>What each worker did</h2>"
    + "<details><summary>Researcher — what the source states, and what it does not</summary>"
    + "<table><tr><th>fact</th><th>value</th><th>quoted from the source</th></tr>"
    + w.researcher.facts.map((f) => "<tr><td>" + esc(f.fact) + "</td><td>" + (f.stated ? esc(f.value) : '<span class="unknown-val">NOT STATED</span>')
      + "</td><td class=\"muted\">" + esc(f.quote || "") + "</td></tr>").join("") + "</table>"
    + "<p><b>Scope:</b> " + val(w.researcher.scopeSummary) + "</p>"
    + "<p><b>Not stated anywhere in the source:</b></p>" + list(w.researcher.notStated, "muted")
    + "<p><b>Still unresolved:</b></p>" + list(w.researcher.unresolved, "muted")
    + '<p class="muted" style="font-size:12px">' + esc(w.researcher.certificationNote || "") + "</p>"
    + "<details><summary>Advanced — raw model output</summary><pre>" + esc(w.researcher.raw || "") + "</pre></details></details>"
    + "<details><summary>Manager — the decision as it was made</summary>"
    + "<p><b>What it treats as fact:</b></p>" + list((w.manager.decision || {}).facts)
    + "<p><b>What it is inferring:</b></p>" + list((w.manager.decision || {}).inferences, "muted")
    + "<p><b>What it is assuming:</b></p>" + list((w.manager.decision || {}).assumptions, "warn")
    + "<p><b>Conflicts it recorded:</b></p>" + list((w.manager.decision || {}).conflicts, "muted")
    + "<p><b>Success condition:</b> " + val((w.manager.decision || {}).successCondition) + "</p>"
    + "<p><b>Failure condition:</b> " + val((w.manager.decision || {}).failureCondition) + "</p>"
    + "<details><summary>Advanced — raw model output</summary><pre>" + esc(w.manager.raw || "") + "</pre></details></details>"
    + "<details><summary>Auditor — what it opened and what it concluded</summary>"
    + "<p><b>Verdict:</b> " + val(w.auditor.verdict) + " &nbsp; <b>Records opened:</b> " + esc((w.auditor.recordsOpened || []).join(", ") || "none")
    + " &nbsp; <b>Turns:</b> " + val(w.auditor.turnsUsed) + "</p>"
    + "<p>" + val(w.auditor.reasoning) + "</p>"
    + "<p><b>Defects named:</b></p>" + list((w.auditor.defects || []).map((d) => d.defectClass + ": " + d.claim), "bad")
    + "<details><summary>Advanced — desk transcript and raw output</summary><pre>"
    + esc((w.auditor.transcript || []).join("\n")) + "\n\n" + esc((w.auditor.raw || []).join("\n\n")) + "</pre></details></details>";
}

const DISPOSITIONS = ["ACKNOWLEDGED", "MARKED_FOR_ACTION", "APPROVED_FOR_PREPARATION"];
function ownerBlock(r) {
  return "<h2>Your decision</h2>"
    + '<p class="muted" style="font-size:13px">This is recorded inside MIDAS and nothing else. There is no state here that sends, submits, applies, pays or contacts anyone.</p>'
    + "<p>Current: <b>" + esc(r.run.ownerDisposition) + "</b></p>"
    + DISPOSITIONS.map((d) => '<button onclick="setDisposition(\'' + r.run.runId + "','" + d + "')\">" + d.replace(/_/g, " ") + "</button>").join("");
}

async function setDisposition(runId, disposition) {
  const out = await post("/console/api/disposition/" + encodeURIComponent(runId), { disposition });
  if (out.error) { alert(out.error); return; }
  openRun(runId);
}

const OUTCOMES = ["NOT_STARTED", "STARTED", "COMPLETED", "NO_RESPONSE", "RESPONSE", "REJECTED", "MEETING", "SALE", "OTHER"];
function outcomeBlock(r) {
  const o = r.run.outcome;
  return "<h2>What actually happened</h2>"
    + '<p class="muted" style="font-size:13px">Recorded by you, after the fact. Nothing learns from this yet; it exists so the real outcome is written down while it is still known.</p>'
    + (o ? "<p>Recorded: <b>" + esc(o) + "</b>" + (r.run.verifiedRevenueUsd !== null ? " · verified revenue $" + esc(r.run.verifiedRevenueUsd) : "") + "</p>" : "")
    + "<label>Outcome</label><select id=\"outState\">" + OUTCOMES.map((s) => "<option" + (o === s ? " selected" : "") + ">" + s + "</option>").join("") + "</select>"
    + "<label>Verified revenue in dollars, if any (leave blank if none)</label><input type=\"number\" id=\"outRev\" min=\"0\" step=\"1\"/>"
    + "<label>What you observed</label><textarea id=\"outObs\"></textarea>"
    + "<label>Notes</label><textarea id=\"outNotes\"></textarea>"
    + '<p><button onclick="saveOutcome(\'' + r.run.runId + "')\">Record outcome</button></p>";
}

async function saveOutcome(runId) {
  const rev = $("outRev").value.trim();
  const out = await post("/console/api/outcome/" + encodeURIComponent(runId), {
    state: $("outState").value,
    verifiedRevenueUsd: rev === "" ? null : Number(rev),
    observed: $("outObs").value, notes: $("outNotes").value,
  });
  if (out.error) { alert(out.error); return; }
  openRun(runId);
}

loadCompany().then(loadList);
</script>
