<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MIDAS</title>
<link rel="stylesheet" href="/product-app.css"/>
<style>
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0B0D12;color:#F4F6FA}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>MIDAS</h1>
        <small>Founder operating system</small>
      </div>
    </div>
    <div class="company-select">
      <label class="field-label" for="wsSelect">Current company</label>
      <select id="wsSelect" onchange="onCompanyChange(this.value)"></select>
    </div>
    <a class="cmd-hint" href="#/command">Ask the team <kbd>/</kbd></a>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <span class="status-chip" id="statusChip" title="Storage, retrieval, and provider details live in Settings / Diagnostics."><i></i> Local workspace</span>
    </div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <button class="menu-btn ghost" type="button" onclick="openSidebar()" aria-label="Open navigation">Menu</button>
      <div>
        <p class="page-kicker" id="pageKicker">MIDAS</p>
        <h2 class="page-title" id="pageTitle">Home</h2>
      </div>
      <div class="topbar-actions" id="topActions"></div>
    </header>
    <p class="err" id="err"></p>
    <div class="workspace" id="workspace">
      <div class="page" id="page">Loading…</div>
      <aside class="rail" id="rail" hidden></aside>
    </div>
  </div>
</div>
<script>
const WS_KEY = 'midas.selectedWorkspace';
const MOTION_KEY = 'midas.reducedMotion';
const PRIMARY_NAV = [
  ["overview","Home"],
  ["companies","Companies"],
  ["opportunities","Opportunities"],
  ["employees","Team"],
  ["work","Work"]
];
const KNOWLEDGE_NAV = [
  ["training","Training"],
  ["research","Research"],
  ["teaching","Teaching"],
  ["knowledge","Knowledge"]
];
const RESULTS_NAV = [
  ["deliverables","Deliverables"],
  ["launch-readiness","Launch Readiness"]
];
const UTILITY_NAV = [
  ["approvals","Approvals"],
  ["treasury","Treasury"],
  ["settings","Settings"],
  ["diagnostics","Diagnostics"]
];
const NAV_LABELS_PRESERVED = ["Overview","Companies","Opportunities","Teams","Employees","Training","Knowledge","Objectives","Work","Approvals","Activity","Spending"];
const MORE_NAV = [
  ["teams","Teams"],
  ["objectives","Objectives"],
  ["activity","Activity"],
  ["spending","Spending"],
  ["command","Command"],
  ["jobs","Jobs"],
  ["artifacts","Artifacts"],
  ["portfolio","Portfolio"],
  ["search","Search"],
  ["autonomy","Autonomy"],
  ["workflow-proof","Workflow proof"]
];
const FOUNDER_NAV = PRIMARY_NAV;
const NAV = PRIMARY_NAV.concat(KNOWLEDGE_NAV).concat(RESULTS_NAV).concat(UTILITY_NAV);
const PAGE_TITLES = {
  overview:'Home', headquarters:'Headquarters', companies:'Companies', opportunities:'Opportunities',
  employees:'Team', teams:'Teams', work:'Work', training:'Training', research:'Research', teaching:'Teaching',
  knowledge:'Knowledge', deliverables:'Results', artifacts:'Artifacts', approvals:'Approvals', treasury:'Treasury',
  spending:'Spending', settings:'Settings', command:'Command', 'launch-readiness':'Launch readiness',
  objectives:'Objectives', activity:'Activity', jobs:'Jobs', portfolio:'Portfolio', search:'Search',
  autonomy:'Autonomy', 'workflow-proof':'Workflow proof', brain:'Brain'
};
let COMPANIES = [];
let COMPANY_INDEX = {};
let LAST_HONESTY = {};
let HQ_STATE = { selected: null, zoom: 1 };

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]);})}
function el(id){return document.getElementById(id)}
async function api(path, init){
  const res = await fetch(path, Object.assign({headers:{'content-type':'application/json'}}, init||{}));
  const data = await res.json();
  if(!res.ok) throw new Error(data.error||res.statusText);
  return data;
}
function route(){
  const raw = (location.hash||'#/overview').replace(/^#\/?/,'').split('?')[0];
  const h = raw.split('/').filter(Boolean);
  return { page: h[0]||'overview', id: h[1]||'', extra: h[2]||'' };
}
function hashQuery(){ return new URLSearchParams((location.hash.split('?')[1]||'')); }
function currentWs(){
  const q = hashQuery();
  return q.get('workspace') || q.get('workspaceId') || localStorage.getItem(WS_KEY) || '';
}
function setWs(id){
  if(id) localStorage.setItem(WS_KEY, id);
  else localStorage.removeItem(WS_KEY);
  const sel = el('wsSelect');
  if(sel && id && sel.value !== id) sel.value = id;
}
function withWs(path){
  const ws = currentWs();
  if(!ws) return path;
  return path + (path.indexOf('?')>=0?'&':'?') + 'workspaceId=' + encodeURIComponent(ws);
}
function companyName(id){
  if(!id) return '';
  const c = COMPANY_INDEX[id];
  return (c && c.name) || id;
}
function isOwnerCompany(c){
  return c && (c.origin === 'owner_intake' || /^ws-own-/.test(c.id) || c.id === 'ws-ridgeline');
}
function friendlyStatus(s){
  const raw = String(s||'').replace(/_/g,' ');
  if(/development verified/i.test(raw)) return 'Development verified';
  if(/supervised internal/i.test(raw)) return 'Supervised internal use';
  if(/authorized/i.test(raw)) return 'Authorized';
  if(/pending/i.test(raw)) return 'Waiting for you';
  if(/block/i.test(raw)) return 'Blocked';
  if(/complete|done/i.test(raw)) return 'Completed';
  if(/active/i.test(raw)) return 'Active';
  return raw ? raw.charAt(0).toUpperCase()+raw.slice(1) : 'Stored';
}
function initials(name){
  return String(name||'?').split(/\s+/).slice(0,2).map(function(p){return p[0];}).join('').toUpperCase();
}
function colorFor(key){
  const palette = ['#d7ae55','#6ea8d8','#6fbf8a','#d48bb0','#c47a4a','#8aa0c8','#7ec8b0','#c4a06a'];
  let h = 0; const s = String(key||'');
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return palette[h % palette.length];
}
function deptForRole(roleId){
  const map = {
    executive:{id:'executive',label:'Leadership'},
    workflow_manager:{id:'management',label:'Leadership'},
    atlas:{id:'management',label:'Leadership'},
    independent_audit:{id:'oversight',label:'Oversight'},
    offer_strategist:{id:'strategy',label:'Strategy'},
    opportunity_generation:{id:'strategy',label:'Strategy'},
    business_research:{id:'research',label:'Research'},
    marketing:{id:'marketing',label:'Marketing'},
    product:{id:'product',label:'Product'},
    knowledge_extraction:{id:'product',label:'Product'},
    ops:{id:'operations',label:'Operations'},
    finance:{id:'finance',label:'Finance'},
    sales:{id:'sales',label:'Sales planning'}
  };
  return map[roleId] || {id:'operations',label:'Operations'};
}
function avatarHtml(name, key){
  return '<div class="avatar" style="background:'+colorFor(key||name)+'">'+esc(initials(name))+'</div>';
}
function money(v){
  if(v==null || v==='') return '—';
  const n = Number(v);
  if(Number.isFinite(n)) return '$' + (Math.abs(n)>=10 ? n.toFixed(2) : String(n));
  return '$' + String(v);
}
function when(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return String(iso).slice(0,16);
  return d.toLocaleString();
}
function claimText(field){
  if(field==null) return '';
  if(typeof field === 'string' || typeof field === 'number') return String(field);
  if(Array.isArray(field)) return field.map(function(x){return claimText(x);}).filter(Boolean).join('; ');
  return String(field.text!=null?field.text:(field.value!=null?field.value:(field.note||'')));
}

function navLink(href, label, page, activePage, badge){
  const first = String(page||'').split('/')[0];
  const cls = (first===activePage?'active':'') + (page==='approvals' && badge ? ' pending' : '');
  const count = (page==='approvals' && badge) ? '<span class="count">'+esc(badge)+'</span>' : '';
  return '<a class="nav-link '+cls+'" href="'+href+'">'+esc(label)+count+'</a>';
}
function setNav(page, pendingCount){
  const ws = currentWs();
  const hqHref = ws ? '#/headquarters?workspace='+encodeURIComponent(ws) : '#/headquarters';
  let html = '<div class="nav-group"><div class="nav-label">Operate</div>';
  PRIMARY_NAV.forEach(function(n){ html += navLink('#/'+n[0], n[1], n[0], page); });
  html += navLink(hqHref, 'Headquarters', 'headquarters', page);
  html += '</div><div class="nav-group"><div class="nav-label">Knowledge</div><div class="nav-sub">';
  KNOWLEDGE_NAV.forEach(function(n){ html += navLink('#/'+n[0], n[1], n[0], page); });
  html += '</div></div><div class="nav-group"><div class="nav-label">Results</div><div class="nav-sub">';
  RESULTS_NAV.forEach(function(n){ html += navLink('#/'+n[0], n[1], n[0], page); });
  html += '</div></div><div class="nav-group"><div class="nav-label">Utility</div>';
  UTILITY_NAV.forEach(function(n){
    const href = n[0]==='diagnostics' ? '/diagnostics' : '#/'+n[0];
    html += navLink(href, n[1], n[0], page, pendingCount);
  });
  html += '</div>';
  el('nav').innerHTML = html;
  el('pageTitle').textContent = PAGE_TITLES[page] || 'MIDAS';
  const co = companyName(ws);
  el('pageKicker').textContent = co || 'MIDAS';
}
function setRail(html){
  const rail = el('rail');
  const wrap = el('workspace');
  if(!html){ rail.hidden = true; rail.innerHTML=''; wrap.classList.remove('has-rail'); return; }
  rail.hidden = false;
  rail.innerHTML = html;
  wrap.classList.add('has-rail');
}
function setTopActions(html){ el('topActions').innerHTML = html || ''; }
function honesty(data){
  LAST_HONESTY = (data && data.honesty) || LAST_HONESTY || {};
  const chip = el('statusChip');
  if(!chip) return;
  const h = LAST_HONESTY;
  chip.title = 'Persistence: FILE_STORE (not PostgreSQL). Retrieval: lexical/deterministic. Search '+(h.searchIntegrationExists===true?'connected-when-proven':'not-connected')+'. Live only when a provider call actually ran. Never 24/7. Details in Settings / Diagnostics.';
}
function showErr(e){ el('err').textContent = e ? String(e.message||e) : ''; }
function card(title, body){ return '<div class="card"><h2>'+esc(title)+'</h2>'+body+'</div>'; }
function empty(msg){ return '<div class="empty">'+esc(msg)+'</div>'; }
function openSidebar(){ el('sidebar').classList.add('open'); el('overlay').classList.add('open'); }
function closeSidebar(){ el('sidebar').classList.remove('open'); el('overlay').classList.remove('open'); }
function onCompanyChange(id){
  setWs(id);
  const r = route();
  const sensitive = {overview:1,employees:1,work:1,training:1,knowledge:1,research:1,teaching:1,deliverables:1,treasury:1,'launch-readiness':1,teams:1,headquarters:1,activity:1,approvals:1,jobs:1,autonomy:1,spending:1};
  if(sensitive[r.page]){
    const base = '#/'+r.page + (r.id?('/'+r.id):'') + (r.extra?('/'+r.extra):'');
    location.hash = id ? (base+'?workspace='+encodeURIComponent(id)) : base;
  } else {
    render();
  }
}
async function refreshCompanies(){
  try{
    const out = await api('/app/companies');
    COMPANIES = out.companies || [];
    COMPANY_INDEX = {};
    COMPANIES.forEach(function(c){ COMPANY_INDEX[c.id]=c; });
    const sel = el('wsSelect');
    let cur = currentWs();
    if(!cur || !COMPANY_INDEX[cur]){
      const prefer = COMPANIES.find(function(c){return c.id==='ws-own-004';}) || COMPANIES.find(isOwnerCompany) || COMPANIES[0];
      cur = prefer ? prefer.id : '';
      if(cur) setWs(cur);
    }
    function opt(c){ return '<option value="'+esc(c.id)+'"'+(c.id===cur?' selected':'')+'>'+esc(c.name)+'</option>'; }
    const iso = COMPANIES.filter(function(c){ return /ws-iso-/.test(c.id) || /isolation/i.test(c.name||''); });
    const primary = COMPANIES.filter(function(c){ return iso.indexOf(c)<0; });
    sel.innerHTML =
      (primary.length ? '<optgroup label="Companies">'+primary.map(opt).join('')+'</optgroup>' : '')+
      (iso.length ? '<optgroup label="Isolation tests">'+iso.map(opt).join('')+'</optgroup>' : '');
  }catch(e){ /* keep last */ }
}

function liveKindPill(live){
  return live ? '<span class="pill live">Live call</span>' : '<span class="pill unknown">Deterministic</span>';
}
function claimPill(cls){
  const raw = String(cls||'unknown').toLowerCase().replace(/[\s-]+/g,'_');
  const map = {
    owner_provided:'Owner-provided', owner_provided_fact:'Owner-provided', owner:'Owner-provided',
    source_supported:'Source-supported', verified_sourced_fact:'Source-supported', sourced:'Source-supported', verified:'Source-supported',
    assumption:'Assumption', assumptions:'Assumption',
    hypothesis:'Hypothesis', model_generated_hypothesis:'Hypothesis', ai_generated_business_hypothesis:'Hypothesis',
    unknown:'Unknown', vendor_or_marketing_claim:'Assumption', vendor:'Assumption'
  };
  const label = map[raw] || String(cls||'Unknown').replace(/_/g,' ');
  const klass = /owner/i.test(label)?'owner':(/source/i.test(label)?'fact':(/hyp/i.test(label)?'hyp':(/assump/i.test(label)?'vendor':'unknown')));
  return '<span class="pill '+klass+'">'+esc(label)+'</span>';
}
function bridgePill(status){
  const s = String(status||'NOT_CONFIGURED').toUpperCase();
  const allowed = ['NOT_CONFIGURED','READY_TO_STAGE','STAGED','OWNER_REPORTED_EXECUTED','VERIFIED_EXECUTED'];
  const label = allowed.indexOf(s)>=0 ? s.replace(/_/g,' ') : 'NOT CONFIGURED';
  const klass = s==='VERIFIED_EXECUTED'?'fact':(s==='STAGED'||s==='READY_TO_STAGE'?'vendor':(s==='OWNER_REPORTED_EXECUTED'?'owner':'unknown'));
  return '<span class="pill '+klass+'">'+esc(label)+'</span>';
}
function claimBlock(label, field){
  const f = field || {};
  if(Array.isArray(f)){
    if(!f.length) return '<p><b>'+esc(label)+'</b> '+claimPill('unknown')+' unknown</p>';
    return '<p><b>'+esc(label)+'</b></p><ul>'+f.map(function(x){return '<li>'+claimPill(x.claimClass)+' '+esc(x.text||x.note||'unknown')+'</li>';}).join('')+'</ul>';
  }
  const text = (f.text==null||f.text==='') ? (f.value==null?'unknown':f.value) : f.text;
  return '<p><b>'+esc(label)+'</b> '+claimPill(f.claimClass||'unknown')+' '+esc(text)+'</p>'+(f.note?'<p class="muted">'+esc(f.note)+'</p>':'');
}
function implPill(status){
  const s = String(status||'unknown');
  const klass = s==='implemented_basic'?'ok':(s==='not_implemented'?'warn':'unknown');
  return '<span class="pill '+klass+'">'+esc(s.replace(/_/g,' '))+'</span>';
}

async function loadPending(){
  try {
    const out = await api('/app/approvals');
    return (out.pending||[]).length;
  } catch(e){ return 0; }
}

function applyMotionPref(){
  if(localStorage.getItem(MOTION_KEY)==='1' || window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.documentElement.classList.add('reduced-motion');
  }
}

async function renderOverview(){
  const ws = currentWs();
  const out = await api('/app/overview');
  honesty(out);
  const selected = (ws && (out.companies||[]).find(function(c){return c.id===ws;})) || out.selectedCompany || (out.companies||[])[0] || null;
  if(selected) setWs(selected.id);
  const pending = (out.pendingApprovals||[]);
  const working = (out.employees||[]).filter(function(e){
    if(selected && e.workspaceId && e.workspaceId!==selected.id) return false;
    return /authorized|supervised|development_verified|active/i.test(String(e.status||e.honestStatus||''));
  });
  const actual = (out.treasury&&out.treasury.actualSpendUsd!=null)?out.treasury.actualSpendUsd:((out.spend&&out.spend.estimatedUsd)!=null?out.spend.estimatedUsd:null);
  const goal = (selected && (selected.goal || selected.ownerGoal || selected.objective)) || out.goal || 'Set a goal with Command, Start, or Grow.';
  const decisions = pending.slice(0,6).map(function(p){
    return '<div class="decision-card attention" style="margin-bottom:8px"><b>'+esc(p.kind||p.id)+'</b> '+claimPill('pending')+
      '<div class="meta muted">'+esc(companyName(p.workspaceId)||p.workspaceId||'')+' · '+esc(p.objectId||'')+'</div>'+
      '<p>'+esc(p.note||'Needs a local owner decision. This screen does not decide it.')+'</p>'+
      (p.id==='APR-005'?'<p class="warn">APR-005 / TPK-001 stays pending until you decide as owner.</p>':'')+
      '</div>';
  }).join('') || empty('Nothing needs your decision right now.');
  const companyCards = (out.companies||[]).filter(isOwnerCompany).concat((out.companies||[]).filter(function(c){return !isOwnerCompany(c);})).slice(0,8).map(function(c){
    const nEmp = (out.employees||[]).filter(function(e){return e.workspaceId===c.id;}).length;
    const recent = (out.activeObjectives||[]).find(function(o){return o.workspaceId===c.id;});
    return '<a class="company-card" href="#/companies/'+encodeURIComponent(c.id)+'"><h3 style="margin:0 0 6px">'+esc(c.name)+'</h3>'+
      '<p class="muted" style="margin:0 0 8px">'+esc(c.industry||c.intakeKind||'Company')+' · '+nEmp+' on team</p>'+
      '<p style="margin:0">'+esc(String(c.goal||c.description||recent&&recent.ownerText||'No current objective stored.').slice(0,160))+'</p></a>';
  }).join('') || empty('No companies in FILE_STORE.');
  const activity = ((out.masterOs&&out.masterOs.reviewNext)||[]).slice(0,5).map(function(x){return '<div class="activity-item">'+esc(x)+'</div>';}).join('');
  const workItems = (out.activeObjectives||[]).filter(function(o){ return !selected || !o.workspaceId || o.workspaceId===selected.id; }).slice(0,6).map(function(o){
    return '<div class="emp"><div><b>'+esc(String(o.ownerText||o.label||'Objective').slice(0,90))+'</b><div class="muted">'+esc(friendlyStatus(o.status))+' · '+esc(companyName(o.workspaceId)||'')+'</div></div><a href="#/work/'+encodeURIComponent(o.id||'')+'">Open</a></div>';
  }).join('') || '<p class="muted">No work in progress.</p>';
  const outs = (out.recentOutputs||[]).slice(0,5).map(function(d){
    const path = (d.artifact&&d.artifact.path)||d.path||'';
    const link = path ? (' · <a href="/app/artifacts/file?path='+encodeURIComponent(path)+'" target="_blank">preview</a>') : '';
    return '<li>'+esc(d.title||d.type||'output')+' · '+esc(friendlyStatus(d.status||'draft'))+link+'</li>';
  }).join('') || '<li class="muted">No deliverables yet.</li>';
  setTopActions('<a href="#/headquarters?workspace='+encodeURIComponent(selected&&selected.id||ws||'')+'"><button class="primary" type="button">Open headquarters</button></a>');
  setRail('<h2>Activity</h2>'+(activity||'<p class="muted">No review queue items.</p>')+'<p><a href="#/activity">Full activity</a></p>');
  el('page').innerHTML =
    '<div class="hero">'+
      '<p class="muted">Selected company</p>'+
      '<h2>'+esc(selected?selected.name:'No company selected')+'</h2>'+
      '<p>'+esc(String(goal).slice(0,280))+'</p>'+
      '<div class="command-bar">'+
        '<textarea id="home-cmd" placeholder="What do you want your team to work on?"></textarea>'+
        '<button class="primary entry" type="button" onclick="submitHomeCommand()">Plan</button>'+
      '</div>'+
      '<p class="muted" id="homeCmdStatus">Deterministic planner ($0). A live model is used only if you choose live planning on Command.</p>'+
    '</div>'+
    '<div class="metrics">'+
      '<div class="metric"><b>'+esc((out.companies||[]).length)+'</b><span>Active companies</span></div>'+
      '<div class="metric"><b>'+esc(working.length)+'</b><span>Authorized employees</span></div>'+
      '<div class="metric"><b>'+esc(pending.length)+'</b><span>Pending decisions</span></div>'+
      '<div class="metric"><b>'+esc(actual==null?'—':money(actual))+'</b><span>Recorded spend</span></div>'+
    '</div>'+
    '<div class="grid-2">'+
      '<div>'+card('Needs your attention', decisions+'<p><a href="#/approvals">Approvals inbox</a></p>')+
        card('Work in progress', workItems+'<p><a href="#/work">Open Work</a></p>')+'</div>'+
      '<div>'+card('Quick actions',
        '<div class="stack"><a href="#/companies/new"><button class="primary entry" type="button">Start a new business</button></a>'+
        '<a href="#/companies/existing"><button class="entry" type="button">Grow an existing business</button></a>'+
        '<a href="#/headquarters?workspace='+encodeURIComponent(selected&&selected.id||'')+'"><button class="entry" type="button">Open headquarters</button></a>'+
        '<a href="#/training?workspace='+encodeURIComponent(selected&&selected.id||'')+'"><button class="entry" type="button">Train employee</button></a>'+
        '<a href="#/approvals"><button class="entry" type="button">Review decisions</button></a></div>')+
        card('Recent results', '<ul>'+outs+'</ul><p><a href="#/deliverables">Open Deliverables</a></p>')+
      '</div></div>'+
    '<div class="section-head"><h2>Companies</h2><a href="#/companies">All companies</a></div>'+
    '<div class="company-grid">'+companyCards+'</div>';
}

async function submitHomeCommand(){
  const text = el('home-cmd') && el('home-cmd').value;
  if(!text){ showErr('Write what you want the team to work on.'); return; }
  el('homeCmdStatus').textContent = 'Planning (deterministic, $0)…';
  try{
    const body = { ownerText: text };
    if(currentWs()) body.workspaceId = currentWs();
    const out = await api('/app/command/plan', { method:'POST', body: JSON.stringify(body) });
    el('homeCmdStatus').textContent = 'Saved '+(out.plan&&out.plan.id);
    if(out.plan&&out.plan.id) location.hash = '#/command/'+encodeURIComponent(out.plan.id);
  }catch(e){ el('homeCmdStatus').textContent = String(e.message||e); }
}

function fieldRow(label, field){
  const f = field || {};
  const val = f.value == null || f.value === '' || (Array.isArray(f.value) && !f.value.length) ? 'unknown' : (Array.isArray(f.value) ? f.value.join(', ') : f.value);
  const src = f.label || f.source || (val === 'unknown' ? 'unknown' : 'owner-provided');
  return '<div class="emp"><div><b>'+esc(label)+'</b> '+claimPill(src)+'<div>'+esc(val)+'</div></div></div>';
}

async function renderCompanies(id){
  if(id === 'new' || id === 'existing'){
    await renderIntake(id === 'existing' ? 'existing_business' : 'new_business');
    return;
  }
  if(id){
    const out = await api('/app/companies/'+encodeURIComponent(id));
    honesty(out);
    setWs(id);
    const c = out.company||{};
    const intake = out.intake || {};
    const fields = intake.fields || {};
    const fieldOrder = c.intakeKind === 'new_business'

async function readIntakeFile(){
  const input = el('in-file');
  if(!input || !input.files || !input.files[0]) return {};
  const file = input.files[0];
  const name = file.name || '';
  if(/\.pdf$/i.test(name) || file.type === 'application/pdf'){
    const buf = await file.arrayBuffer();
    const bytes = new Uint8Array(buf);
    let bin = '';
    for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return { existingDocumentsFilename: name, existingDocumentsPdfBase64: btoa(bin) };
  }
  const text = await file.text();
  return { existingDocumentsFilename: name, existingDocumentsText: text, existingDocumentsSourceType: /\.md$/i.test(name) ? 'owner_markdown' : 'owner_paste' };
}

async function submitIntake(kind){
  showErr('');
  const ids = kind === 'existing_business'
    ? ['companyName','businessDescription','existingOffer','customerProfile','currentChallenges','goals','existingDocuments','existingProcedures','ownerConstraints','availableResources']
    : ['companyName','ownerObjective','revenueGoal','budget','timeline','preferredIndustries','availableSkillsAndResources','geographicConstraints','riskTolerance','permittedResearchScope','ownerApprovalRequirements'];
  const payload = { kind: kind };
  ids.forEach(function(id){
    const node = el('in-'+id);
    if(node) payload[id] = node.value;
  });
  try{
    const extra = await readIntakeFile();
    Object.assign(payload, extra);
    const path = kind === 'existing_business' ? '/app/companies/intake/existing' : '/app/companies/intake/new';
    const out = await api(path, { method:'POST', body: JSON.stringify(payload) });
    el('inStatus').className = 'ok';
    el('inStatus').textContent = 'Created '+out.company.id+' — real FILE_STORE workspace.';
    setWs(out.company.id);
    location.hash = '#/companies/'+encodeURIComponent(out.company.id);
  }catch(e){
    el('inStatus').className = 'fail';
    el('inStatus').textContent = e.message || String(e);
    showErr(e);
  }
}

function taskBlurb(e){
  if(e.currentTask && (e.currentTask.summary||e.currentTask.status)) return e.currentTask.summary || friendlyStatus(e.currentTask.status);
  const st = String(e.honestStatus||e.status||'');
  if(/development_verified/i.test(st)) return 'Verified for development use';
  if(/watcher|independent_audit/i.test(e.roleId||'')) return 'Last review is inspectable';
  if(/workflow_manager/i.test(e.roleId||'')) return 'Coordinates stored work';
  return friendlyStatus(st) || 'Present, no current task';
}

function laneOf(status){
  const s = String(status||'').toLowerCase();
  if(/block|fail/.test(s)) return 'blocked';
  if(/approv|waiting|owner/.test(s)) return 'waiting';
  if(/complete|done|succeed/.test(s)) return 'completed';
  if(/run|progress|active|work|live/.test(s)) return 'progress';
  return 'planned';
}
async function submitWork(){
  const ws = (el('wk-ws')&&el('wk-ws').value)||'';
  const text = (el('wk-obj')&&el('wk-obj').value)||'';
  const budget = (el('wk-budget')&&el('wk-budget').value)||'';
  if(!ws){ showErr('Pick a company workspace first.'); return; }
  try{
    const body = { workspaceId: ws, ownerText: text };
    if(budget) body.maxSpendUsd = budget;
    if(el('wk-live')&&el('wk-live').checked) body.preferLive = true;
    const out = await api('/app/work/submit',{method:'POST',body:JSON.stringify(body)});
    if(out.code==='NO_TEAM'){
      el('wkStatus').className='warn';
      el('wkStatus').textContent = out.message||'No team yet.';
      return;
    }
    el('wkStatus').className='ok';
    el('wkStatus').textContent = 'Submitted '+(out.objective&&out.objective.id)+' · '+(out.objective&&out.objective.status);
    location.hash = '#/work/'+encodeURIComponent(out.objective.id)+'?workspace='+encodeURIComponent(ws);
  }catch(e){
    el('wkStatus').className='fail';
    el('wkStatus').textContent = e.message||String(e);
    showErr(e);
  }
}

function drawHqHandoffs(){
  const floor = el('hqFloor');
  const svg = el('hqLines');
  const out = HQ_STATE.data || {};
  if(!floor || !svg) return;
  const w = floor.offsetWidth;
  const h = floor.offsetHeight;
  svg.setAttribute('viewBox', '0 0 '+w+' '+h);
  svg.setAttribute('width', String(w));
  svg.setAttribute('height', String(h));
  const origin = floor.getBoundingClientRect();
  const seen = {};
  const lines = (out.handoffs||[]).map(function(link){
    const key = link.kind+'|'+link.fromEmployeeId+'|'+link.toEmployeeId;
    if(seen[key]) return '';
    seen[key] = 1;
    const a = floor.querySelector('[data-emp="'+String(link.fromEmployeeId).replace(/"/g,'')+'"]');
    const b = floor.querySelector('[data-emp="'+String(link.toEmployeeId).replace(/"/g,'')+'"]');
    if(!a || !b) return '';
    const ar = a.getBoundingClientRect();
    const br = b.getBoundingClientRect();
    const x1 = ar.left + ar.width/2 - origin.left;
    const y1 = ar.top + ar.height/2 - origin.top;
    const x2 = br.left + br.width/2 - origin.left;
    const y2 = br.top + br.height/2 - origin.top;
    const cls = link.kind==='teaching' ? 'teach' : 'flow';
    return '<line class="'+cls+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" />';
  }).join('');
  svg.innerHTML = lines;
}

    const preview = fpath ? ('<a href="/app/artifacts/file?path='+encodeURIComponent(fpath)+'" target="_blank">preview</a> · <a href="/app/artifacts/file?path='+encodeURIComponent(fpath)+'&download=1">download</a>') : '<span class="muted">no file</span>';
    const published = String(d.status||'').toLowerCase()==='published';
    return '<div class="result-card"><h3>'+esc(d.title||d.type||d.id)+'</h3>'+
      '<p class="muted">'+esc(companyName(d.workspaceId))+' · '+esc(d.type||'artifact')+' · '+(published?'Published':(draft?'Draft':esc(friendlyStatus(d.status))))+'</p>'+
      '<p>'+preview+'</p></div>';
  }).join('') || empty('No deliverables in this workspace.');
  el('page').innerHTML = card('Results', '<p>Inspectable drafts only. Not deployed unless a record is actually published.</p><div class="result-grid">'+rows+'</div>');
}
async function renderSearch(){
  const out = await api('/app/search');
  honesty(out);
  const recs = (out.records||[]).map(function(r){
    return '<div class="emp"><div><b>'+esc(r.query)+'</b><div class="muted">'+esc(r.provider)+' · '+(r.live?'live':'not live')+'</div></div></div>';
  }).join('') || empty('No persisted search records. Search stays not-connected until a real official call succeeds.');
  el('page').innerHTML = card('Search',
    '<p>Status: <b>'+esc(out.status)+'</b></p>'+
    '<p class="muted">'+esc(out.note||'')+'</p>'
  )+card('Persisted queries', recs);
}

async function renderJobs(){
  const workspace = hashQuery().get('workspace') || hashQuery().get('workspaceId') || currentWs() || 'ws-own-004';
  const out = await api('/app/jobs?workspaceId='+encodeURIComponent(workspace));
  honesty(out);
  const jobs = (out.jobs||[]).map(function(j){
    return '<div class="emp"><div><b>'+esc(j.id)+'</b> <span class="pill fact">'+esc(j.status)+'</span><div class="muted">Last heartbeat '+esc(j.lastHeartbeatAt||'none')+' · next '+esc(j.nextRunAt||'none')+'</div></div></div>';
  }).join('') || empty('No scheduled jobs.');
  el('page').innerHTML =
    card('Scheduled jobs',
      '<p class="muted">FILE_STORE foundations — NOT 24/7 infrastructure.</p>'+jobs+
      '<p><button class="primary entry" type="button" onclick="runJobTick()">Run worker tick</button> <span class="muted" id="jobTickStatus"></span></p>'
    );
}
async function runJobTick(){
  showErr('');
  try{
    const out = await api('/app/jobs/tick',{method:'POST',body:JSON.stringify({jobId:'JOB-001',workspaceId:'ws-own-004',forceDue:false})});
    if(el('jobTickStatus')){ el('jobTickStatus').className='ok'; el('jobTickStatus').textContent='outcome='+esc(out.outcome); }
    await renderJobs();
  }catch(e){ showErr(e); }
}
async function renderAutonomy(){
  const workspace = hashQuery().get('workspace') || hashQuery().get('workspaceId') || currentWs() || '';
  const path = workspace ? '/app/autonomy?workspaceId='+encodeURIComponent(workspace) : '/app/autonomy';
  const out = await api(path);
  honesty(out);
  const companies = await api('/app/companies');
  const wsOpts = ['<option value="">Select a company</option>'].concat((companies.companies||[]).map(function(c){
    const id = c.id || c.workspaceId;
    return '<option value="'+esc(id)+'"'+(id===workspace?' selected':'')+'>'+esc(c.name||id)+'</option>';
  })).join('');
  const active = out.active || null;
  const rows = (out.policies||[]).map(function(p){
    return '<div class="emp"><div><b>'+esc(p.id)+'</b> '+(p.active===false?'<span class="pill unknown">revoked</span>':'<span class="pill fact">active</span>')+'<div class="muted">'+esc(companyName(p.workspaceId))+' · budget '+money(p.budgetUsd)+'</div></div></div>';
  }).join('') || empty('No owner-persisted internal autonomy policy yet.');
  el('page').innerHTML =
    card('Internal autonomy policy',
      '<p class="muted">'+esc(out.note||'')+'</p>'+
      '<label>Company workspace<select id="au-ws">'+wsOpts+'</select></label>'+
      '<label>Authorized internal actions (comma)<input id="au-allow" value="'+(out.defaultAuthorized||[]).join(', ')+'"></label>'+
      '<label>Forbidden actions (comma)<input id="au-forbid" value="'+(out.defaultForbidden||[]).join(', ')+'"></label>'+
      '<label>Approved domains (comma)<input id="au-dom" placeholder="optional"></label>'+
      '<label>Budget USD<input id="au-budget" value="0"></label>'+
      '<label>Expiration ISO<input id="au-exp" placeholder="optional"></label>'+
      '<p><button class="primary entry" type="button" onclick="submitAutonomy()">Save autonomy policy</button></p>'+
      '<p class="muted" id="auStatus"></p>'+
      (active?'<p class="ok">Active policy '+esc(active.id)+'</p>':'<p class="muted">No active policy in this workspace.</p>')
    )+card('Persisted policies', rows);
}
async function submitAutonomy(){
  showErr('');
  try{
    const ws = (el('au-ws')&&el('au-ws').value)||'';
    if(!ws){ showErr('Pick a company workspace first.'); return; }
    const split = function(s){return String(s||'').split(',').map(function(x){return x.trim();}).filter(Boolean);};
    const out = await api('/app/autonomy',{method:'POST',body:JSON.stringify({
      workspaceId: ws,
      actor: 'owner',
      authorized: true,
      confirm: 'Save autonomy policy',
      authorizedActions: split(el('au-allow').value),
      forbiddenActions: split(el('au-forbid').value),
      approvedDomains: split(el('au-dom').value),
      budgetUsd: el('au-budget').value,
      expiration: el('au-exp').value || null
    })});
    el('auStatus').className='ok';
    el('auStatus').textContent = 'Saved '+out.policy.id+' by '+out.authorizedBy;
    location.hash = '#/autonomy?workspace='+encodeURIComponent(ws);
    await render();
  }catch(e){
    el('auStatus').className='fail';
    el('auStatus').textContent = e.message||String(e);
    showErr(e);
  }
}

async function render(){
  showErr('');
  closeSidebar();
  applyMotionPref();
  if(!el('page') || !el('rail')){
    el('workspace').innerHTML = '<div class="page" id="page"></div><aside class="rail" id="rail" hidden></aside>';
  }
  const r = route();
  if(!COMPANIES.length) await refreshCompanies();
  const pending = await loadPending();
  setNav(r.page, pending);
  setRail('');
  setTopActions('');
  el('page').classList.remove('flush');
  try{
    if(r.page==='overview') await renderOverview();
    else if(r.page==='headquarters' || r.page==='hq') await renderHeadquarters();
    else if(r.page==='command') await renderCommand(r.id);
    else if(r.page==='launch-readiness') await renderLaunchReadiness();
    else if(r.page==='settings' || r.page==='diagnostics') await renderSettings();
    else if(r.page==='research') await renderResearchPage();
    else if(r.page==='teaching') await renderTeachingPage();
    else if(r.page==='brain') await renderBrainPage();
    else if(r.page==='companies') await renderCompanies(r.id);
    else if(r.page==='employees') await renderEmployees(r.id, r.extra);
    else if(r.page==='training') await renderTraining();
    else if(r.page==='knowledge') await renderKnowledge();
    else if(r.page==='approvals') await renderApprovals();
    else if(r.page==='objectives') await renderObjectives();
    else if(r.page==='activity') await renderActivity();
    else if(r.page==='jobs') await renderJobs();
    else if(r.page==='spending') await renderSpending();
    else if(r.page==='treasury') await renderTreasury();
    else if(r.page==='artifacts') await renderArtifacts();
    else if(r.page==='opportunities') await renderOpportunities(r.id, r.extra);
    else if(r.page==='teams') await renderTeams(r.id);
    else if(r.page==='work') await renderWork(r.id);
    else if(r.page==='autonomy') await renderAutonomy();
    else if(r.page==='workflow-proof') await renderWorkflowProof();
    else if(r.page==='portfolio') await renderPortfolio();
    else if(r.page==='deliverables') await renderDeliverables();
    else if(r.page==='search') await renderSearch();
    else await renderOverview();
  }catch(e){ showErr(e); const p=el('page'); if(p) p.innerHTML = '<div class="card fail">'+esc(e.message||e)+'<pre>'+esc(e.stack||'')+'</pre></div>'; }
}

window.addEventListener('hashchange', render);
window.addEventListener('keydown', function(ev){
  if(ev.key==='/' && ev.target && ev.target.tagName!=='INPUT' && ev.target.tagName!=='TEXTAREA'){
    ev.preventDefault();
    location.hash = '#/command';
  }
});
if(!location.hash) location.hash = '#/overview';
render();
